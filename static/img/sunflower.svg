      <path d="M0 -9.0 Q6.5 -18.6 0 -33.8 Q-6.5 -18.6 0 -9.0Z" transform="rotate(207.3)"/>
      <path d="M0 -9.0 Q7.1 -19.0 0 -34.5 Q-7.1 -19.0 0 -9.0Z" transform="rotate(228.9)"/>
      <path d="M0 -9.0 Q7.0 -20.1 0 -36.5 Q-7.0 -20.1 0 -9.0Z" transform="rotate(257.3)"/>
      <path d="M0 -9.0 Q6.3 -19.7 0 -35.9 Q-6.3 -19.7 0 -9.0Z" transform="rotate(283.6)"/>
      <path d="M0 -9.0 Q5.7 -20.2 0 -36.7 Q-5.7 -20.2 0 -9.0Z" transform="rotate(309.6)"/>
      <path d="M0 -9.0 Q5.8 -18.8 0 -34.2 Q-5.8 -18.8 0 -9.0Z" transform="rotate(338.2)"/>
    </g>
    <circle r="10.0" fill="#a16207"/>
    <circle r="5.5" fill="#78350f"/>
  </g>
</defs>
  <use href="#a" transform="translate(120 150) rotate(-14) scale(1.0)"/>
