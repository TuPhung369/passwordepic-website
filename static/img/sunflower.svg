      <path d="M0 -11.0 Q8.0 -18.5 0 -33.7 Q-8.0 -18.5 0 -11.0Z" transform="rotate(273.4)"/>
      <path d="M0 -11.0 Q8.4 -19.4 0 -35.2 Q-8.4 -19.4 0 -11.0Z" transform="rotate(296.2)"/>
      <path d="M0 -11.0 Q9.3 -17.2 0 -31.2 Q-9.3 -17.2 0 -11.0Z" transform="rotate(334.5)"/>
    </g>
    <circle r="12.0" fill="#a16207"/>
    <circle r="6.6" fill="#78350f"/>
  </g>
  <g id="c">
    <g fill="#eab308">
      <path d="M0 -9.0 Q7.2 -18.7 0 -34.1 Q-7.2 -18.7 0 -9.0Z" transform="rotate(0.4)"/>
