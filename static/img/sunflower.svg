<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960">
  <!-- One tile of the light theme's page background: ten sunflower heads
       scattered across 960px, with the gaps between them several times wider
       than the flowers themselves.

       Three things here are deliberate. Petal count, length, width and angle
       all vary, flower to flower and petal to petal - a head built from twelve
       identical ellipses at exact 30-degree steps reads as a logo, not a
       flower. The heads are placed by eye rather than on a grid, with one
       clump and one wide gap, because an even spread is the other way a
       pattern announces itself. And the tile is large: at 640px the repeat was
       visible twice across an ordinary window.

       Every head sits clear of the edge, so the tile repeats without cutting
       one in half. css/custom.css lays a second, smaller copy of this same
       tile over the first at an offset. -->
<defs>
  <g id="a">
    <g fill="#eab308">
      <path d="M0 -10.0 Q7.2 -18.8 0 -34.2 Q-7.2 -18.8 0 -10.0Z" transform="rotate(-2.4)"/>
      <path d="M0 -10.0 Q6.5 -19.1 0 -34.7 Q-6.5 -19.1 0 -10.0Z" transform="rotate(28.6)"/>
      <path d="M0 -10.0 Q7.0 -19.7 0 -35.9 Q-7.0 -19.7 0 -10.0Z" transform="rotate(51.0)"/>
      <path d="M0 -10.0 Q7.4 -20.2 0 -36.7 Q-7.4 -20.2 0 -10.0Z" transform="rotate(80.7)"/>
      <path d="M0 -10.0 Q7.8 -18.6 0 -33.9 Q-7.8 -18.6 0 -10.0Z" transform="rotate(113.8)"/>
      <path d="M0 -10.0 Q8.3 -19.1 0 -34.7 Q-8.3 -19.1 0 -10.0Z" transform="rotate(135.3)"/>
      <path d="M0 -10.0 Q7.9 -19.4 0 -35.3 Q-7.9 -19.4 0 -10.0Z" transform="rotate(166.4)"/>
      <path d="M0 -10.0 Q7.7 -19.5 0 -35.4 Q-7.7 -19.5 0 -10.0Z" transform="rotate(189.9)"/>
      <path d="M0 -10.0 Q8.3 -17.3 0 -31.4 Q-8.3 -17.3 0 -10.0Z" transform="rotate(219.7)"/>
      <path d="M0 -10.0 Q8.4 -19.4 0 -35.2 Q-8.4 -19.4 0 -10.0Z" transform="rotate(249.0)"/>
      <path d="M0 -10.0 Q7.3 -20.0 0 -36.3 Q-7.3 -20.0 0 -10.0Z" transform="rotate(278.9)"/>
      <path d="M0 -10.0 Q8.5 -18.5 0 -33.7 Q-8.5 -18.5 0 -10.0Z" transform="rotate(307.3)"/>
      <path d="M0 -10.0 Q6.7 -17.5 0 -31.8 Q-6.7 -17.5 0 -10.0Z" transform="rotate(335.7)"/>
    </g>
    <circle r="11.0" fill="#a16207"/>
    <circle r="6.1" fill="#78350f"/>
  </g>
  <g id="b">
    <g fill="#eab308">
      <path d="M0 -11.0 Q9.7 -19.0 0 -34.5 Q-9.7 -19.0 0 -11.0Z" transform="rotate(0.2)"/>
      <path d="M0 -11.0 Q9.0 -18.9 0 -34.3 Q-9.0 -18.9 0 -11.0Z" transform="rotate(28.1)"/>
      <path d="M0 -11.0 Q7.3 -17.1 0 -31.0 Q-7.3 -17.1 0 -11.0Z" transform="rotate(61.5)"/>
      <path d="M0 -11.0 Q7.9 -18.8 0 -34.2 Q-7.9 -18.8 0 -11.0Z" transform="rotate(89.0)"/>
      <path d="M0 -11.0 Q9.4 -17.6 0 -32.1 Q-9.4 -17.6 0 -11.0Z" transform="rotate(120.0)"/>
      <path d="M0 -11.0 Q9.8 -17.9 0 -32.5 Q-9.8 -17.9 0 -11.0Z" transform="rotate(154.0)"/>
